title = "Multi-monitor recording end to end on the builder's PC"
description = "The closing end-to-end check of the epic's Done when, integrated: an automated suite against the installed build on a dev instance sets monitorRecordingScreens to two screens and to All screens, starts and stops Monitor Recordings with the injected key with and without a synthetic game, checks each file with ffprobe (one video at the canvas size, every Track, plays to the end) and the encoder-chain count with the Replay Buffer running, reruns story 8.5's monitor-change tests and 8.3's simulated GPU reset against the multi-screen path, and confirms an old single-monitor setting still records that monitor. The builder then records their screens for a few minutes during a game, unplugs one recorded monitor mid-Recording and plugs it back, checks the file and the FPS cost in their game, and uses the picker in both themes."
verify = "The automated suite passes against the installed build, and the builder's session confirms each Done-when line."
covers = ["R1", "R2", "R3", "R4", "R5"]
