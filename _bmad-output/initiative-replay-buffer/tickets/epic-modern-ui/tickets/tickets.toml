[[entry]]
id = 9
type = "story"
title = "Modern UI end to end on the builder's PC"
description = "The closing end-to-end check of the epic's Done when, integrated: an automated suite against the installed build opens the App on a dev instance in each theme, switches theme through settings.update with every page, the tray menu and a dialog open and checks each restyles with no restart and no missing resource, restarts the App and checks the theme is kept, and runs every existing App test. The builder then uses the installed App for a session in each theme: walks every page, saves a Clip in a game and sees the Overlay's message, uses the tray menu and a delete confirmation, changes the Windows mode and accent under Fluent, and picks the theme they keep."
verify = "The automated suite passes against the installed build, and the builder's session confirms each Done-when line."
covers = ["R1", "R2", "R3", "R4", "R5", "R6"]
after = [8]
hitl = true
risk = "low"
