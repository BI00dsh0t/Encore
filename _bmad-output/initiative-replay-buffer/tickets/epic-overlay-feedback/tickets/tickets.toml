title = "Feedback Sounds settings page"
description = "A Feedback Sounds page in the Settings host (after story 4.12, which also adds a page there): an on/off switch per sound (feedbackSounds), the sound device (feedbackSoundDevice) picked from story 2.3's live Output Device list with \"Default communications device\" first, and a Play button per sound that sends story 6's feedback.preview { sound } command so the builder hears it on the chosen device even when switched off; the feedback-device-captured warning shows on the page. Changes go through the settings.update sender. There is no separate UX design; the builder checks it by hand. R4 part: switching sounds off."
verify = "Automated tests: switching a sound off sends a settings.update for feedbackSounds and the engine stops playing it; choosing a device sets feedbackSoundDevice; the Play button sends feedback.preview for its sound. The builder switches the save-failed sound off and on, picks another device, and plays each sound."
covers = ["R4"]
after = [6, 10, "2.3", "4.12"]
hitl = true
risk = "low"

