[[entry]]
id = 8
type = "story"
title = "UX pass 2 end to end on the builder's PC"
description = "The closing end-to-end check of the epic's Done when, integrated. An automated suite runs against the installed build on a dev instance. It starts from an empty settings folder and checks the seeded layout records the default devices; it fabricates a Library and drives the selection, a bulk Favourite, Copy and a delete with a Favourite kept through the view models; it checks sort and search; it applies a preset and saves it; and it runs every App test. The builder then uses the installed App for a session in each theme. They clear out and share a batch of real Clips with the mouse and keyboard, search and sort the Library, and set up Audio Tracks from a preset on their BEACN devices. They save a Clip in a game and check its tracks, read the welcome card on a fresh dev instance, and use the new tray items."
verify = "The automated suite passes against the installed build, and the builder's session confirms each Done-when line."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8"]
after = [7]
hitl = true
risk = "low"
