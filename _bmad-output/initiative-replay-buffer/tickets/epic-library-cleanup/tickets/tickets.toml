# Stories of epic-library-cleanup, in build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Tracer: a saved Clip appears in the Library within 2 s"
description = "Thinnest path through every layer: a single-threaded LibraryActor in Core (AD-17) replaces story 4.5's no-op Library port. BeginWrite adds the absolute path to the being-written set with its profileId; EndWrite(success) adds or updates the item, keyed by its path relative to the Output Folder, with profileId, size and date (the BeginWrite time), and EndWrite(failure) drops it. At start the engine lists the Output Folder's *.mp4 files into the index; library.json in %APPDATA%\\ReplayBuffer[-<instance>]\\ holds it, written atomically. The items are a new library field of state.snapshot, kept current by library.itemAdded, library.itemChanged and library.itemRemoved events (Contracts/Library.cs, its own JSON context, a Contracts test mapping each event to the snapshot field). A Library page in the Main App lists the items newest first with name, game (the profile's name from the snapshot), date and size, and a being-written item shows as locked. The builder saves a Clip in a game and sees it appear in the Library within 2 s. R1. R3 part: name, game, date and size."
verify = "Automated tests: a fake writer's BeginWrite then EndWrite(success) on a file in a temp Output Folder produces one library.itemAdded within 2 s and the item in the next state.snapshot with its profileId; EndWrite(failure) leaves no item; a restarted engine loads the item from library.json; the Library view model lists items newest first and marks a being-written one locked; the Contracts test maps every library event to the snapshot. The builder saves a Clip and sees it in the Library within 2 s."
covers = ["R1", "R3"]
after = ["4.5", "3.5"]
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Changes outside the app, reconciliation and a corrupt index"
description = "Keep the index right whatever happens to the folder (AD-17): at start the first scan is reconciled with library.json (new files added, missing ones removed, metadata kept for unchanged ones), then a FileSystemWatcher on the Output Folder and its subfolders (*.mp4 only) posts to the LibraryActor; an overflow triggers a full rescan. A rename outside the app moves the item's metadata to the new path. The engine's own renames and deletes are registered in advance, so their watcher echoes are ignored. *.rbpart files are never items and are deleted when the engine starts. library.json gets a .bak; if neither copy parses, warning.raised { code: library-corrupt, dismissable } is raised, the index is rebuilt from the scan, and a cleanupBlocked flag in the snapshot stays set until the warning is dismissed; the Library page shows it as a banner with an Acknowledge button that sends warning.dismiss. Changing outputFolder rebuilds the index from the new folder only, and a missing Output Folder is created. A scan's file found under a profile's folder (story 3.5's persisted name) takes that profileId. R2."
verify = "Automated tests on a temp Output Folder: files copied in, renamed and deleted by another process are reflected in the snapshot within 2 s; a rename keeps the item's metadata; a forced watcher overflow ends in a correct index; a registered engine rename produces no extra events; a leftover .rbpart is deleted at start and never listed; with library.json and its .bak both corrupted the engine raises library-corrupt, rebuilds from the scan and keeps cleanupBlocked until the warning is dismissed; switching outputFolder lists only the new folder's files."
covers = ["R2"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Length and thumbnails"
description = "Each item shows its length and a thumbnail (FR-30). The engine reads the length with Platform.FFmpeg's demuxer (avformat_open_input and find_stream_info, no decode) after a successful EndWrite and for new or changed files the scan finds, off the actor thread at low I/O priority, and caches it in library.json by size and mtime; a file it can't read shows no length and is logged. The App gets thumbnails from the Windows shell by path (IShellItemImageFactory, SIIGBF_THUMBNAILONLY, AD-1) on a background thread, keeps them in an in-memory cache, shows a generic icon when the shell has none, and never asks for one while the item is being written; it asks again after EndWrite. The rows show length as m:ss (h:mm:ss past an hour) and size in MB or GB. R3 part: length and thumbnail."
verify = "Automated tests: a 30 s test Clip gets a length within 0.1 s of ffprobe's; a truncated fragmented MP4 gets the length of its last fragment; an unreadable .mp4 gets no length and no crash; the cached length is reused while size and mtime are unchanged; the App's thumbnail provider is never called for a being-written item and is called after its EndWrite. The builder sees thumbnails and lengths for their Clips."
covers = ["R3"]
after = [2]
hitl = true
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Favourite"
description = "A library.setFavourite command (Contracts/Library.cs) carrying the item's path, size and mtime (AD-3) sets or clears the item's Favourite in library.json through the LibraryActor and emits library.itemChanged; a stale identity is refused with library-item-changed (new in Contracts.ErrorCodes) and isn't retried. The Favourite survives an engine restart, a rename outside the app (story 2) and a rebuild from the .bak. The Library row has a star toggle. Being written doesn't block a Favourite. R6 part: Favourite."
verify = "Automated tests: setFavourite on an item persists across an engine restart and an outside rename; a command with an old mtime is refused with library-item-changed; the star toggle sends the command and the row follows library.itemChanged."
covers = ["R6"]
after = [3]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Group and filter by game, date and Favourite"
description = "The Library page groups items by game or by day (Today, Yesterday, then each date, newest first) and filters by game (one or all), by date (Today, Last 7 days, Last 30 days, All) and to Favourites only, together. Game names come from the Game Profiles in the snapshot (a renamed profile renames its group); Monitor Recordings are their own group; files with no profile are grouped by their top-level folder, or Other at the Output Folder's root. The grouping and filters are view state in the App, remembered per App instance, and new items land in the right group as they arrive. The list virtualizes, so a few thousand items stay responsive. R4."
verify = "Automated tests on the view model with fabricated items across three games, Monitor Recordings and the root: each grouping and each filter (and their combination) gives the expected groups and rows; a new item arrives in the right group; renaming a profile renames its group; 5 000 items group and filter in under 200 ms."
covers = ["R4"]
after = [4]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Open, show in Explorer and copy for Discord"
description = "App-side shell actions on an item's path (AD-1), from the row's context menu and its double-click: Open starts the Windows default app for .mp4 (ShellExecute open, the Media Player); Show in Explorer opens its folder with the file selected (SHOpenFolderAndSelectItems); Copy puts the file on the clipboard as CF_HDROP with Preferred DropEffect copy, so it pastes into Discord as an attachment. The App never opens the file's contents. A file that no longer exists shows a short error and the row goes on the next library event. Each action works on a being-written item except Copy, which waits until EndWrite. R5."
verify = "Automated tests: Copy puts exactly the item's absolute path on the clipboard as CF_HDROP with DROPEFFECT_COPY, and is disabled while the item is being written; Open and Show in Explorer call the shell with the item's path (through a fake shell port). The builder double-clicks a Clip and it opens in their default player, uses Show in Explorer, and pastes a copied Clip into a Discord message as an attachment that plays."
covers = ["R5"]
after = [5]
hitl = true
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Rename and delete, locked while being written"
description = "library.rename { path, size, mtime, newName } and library.delete { path, size, mtime } commands through the LibraryActor (AD-17), each registering its own change in advance so the watcher echo is ignored. Rename changes only the base name (the .mp4 and the folder stay) and keeps the item's metadata; delete sends the file to the Recycle Bin with the shell's recycle operation (IFileOperation with FOFX_RECYCLEONDELETE) and removes the item. Both are refused for a path in the being-written set with file-being-written, rename also with invalid-file-name and file-name-taken, delete with recycle-bin-unavailable on a volume with no Recycle Bin, and both with library-item-changed on a stale identity (new codes in Contracts.ErrorCodes). The Library row gets Rename (inline edit) and Delete, which first asks for confirmation; both are disabled while the item is being written. Locking is checked with Clips and with a fake Recording writer growing a sample fragmented MP4 between BeginWrite and EndWrite. R6 part: rename, delete and the lock."
verify = "Automated tests: a rename moves the file and keeps its Favourite with no extra events; a delete leaves the file in the Recycle Bin (restorable) and removes the item; rename and delete of a file between BeginWrite and EndWrite (a Clip and a growing sample Recording) are refused with file-being-written and leave it untouched; a name with a colon, an existing name and a stale mtime are refused with their codes; the Delete button shows the confirmation and sends nothing on Cancel. The builder renames and deletes a Clip and restores it from the Recycle Bin."
covers = ["R6"]
after = [6]
hitl = true
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Cleanup"
description = "Cleanup in the LibraryActor (AD-17, FR-32, PLAN.md T-19): with cleanup.maxBytes and/or maxAgeSeconds set, it permanently deletes indexed *.mp4 items, oldest first by date, skipping Favourites and files being written (re-checked immediately before each delete), until the folder's indexed size is within maxBytes and no item is older than maxAgeSeconds. Every indexed item counts toward the size. It runs after each successful EndWrite, when cleanup changes, after the first scan is reconciled, and every 10 minutes; never in the first 60 s after start, before reconciliation, or while cleanupBlocked is set (story 2). Each delete is registered in advance and emits library.itemRemoved { reason: cleanup }, and is logged with the file's path and size; a file it can't delete is skipped until the next pass. When only Favourites and files being written remain over the limit it stops and raises warning.raised { code: cleanup-limit-unreachable, dismissable } once per crossing. A cleanup.preview { maxBytes, maxAgeSeconds } command returns what would be deleted now (count, bytes, paths) without deleting. R7."
verify = "Automated tests with a fake clock on fabricated items: over the size limit the oldest non-Favourite items are deleted until within it; over the age limit only older items go; a Favourite that is the oldest is never deleted; a file between BeginWrite and EndWrite is never deleted, nor one made a Favourite between the plan and the delete; nothing runs before 60 s, before reconciliation or while cleanupBlocked; Favourites alone over the limit raise one cleanup-limit-unreachable; a locked file is skipped and deleted on the next pass; cleanup.preview matches what the next pass deletes; with both limits null nothing is ever deleted."
covers = ["R7"]
after = [7]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "Library and Cleanup settings page"
description = "A Library and Cleanup page in the Settings host (story 1.7), sent through its settings.update sender: the Output Folder with a folder picker and its current size, and the Cleanup size limit (GB) and age limit (days), each off by default. Turning a limit on, or lowering one, first shows a confirmation that deletion is permanent with what cleanup.preview says would be deleted now (count and size), and sends the update only on confirm; turning a limit off needs no confirmation. Changing the Output Folder says the Library will list only the new folder and that existing files aren't moved. There is no separate UX design; the builder checks the page by hand. R8. R7 part: the confirmation."
verify = "Automated tests on the view model: enabling a size limit shows the confirmation with the preview's count and sends settings.update only on confirm; Cancel leaves cleanup null; lowering a limit asks again, raising or clearing one doesn't; picking a folder sends outputFolder. The builder sets the Output Folder, sets a size limit just under the folder's size, confirms, and sees the oldest non-Favourite Clip go."
covers = ["R7", "R8"]
after = [8]
hitl = true
risk = "low"

