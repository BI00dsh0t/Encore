[[entry]]
id = 11
type = "story"
title = "Library and Cleanup end to end on the builder's PC"
description = "The closing end-to-end check of the epic's Done when, integrated: an automated suite drives the installed engine and App against a temp Output Folder and checks a Clip saved with an injected Save Hotkey appearing within 2 s with its thumbnail, length and size; files added, renamed and removed outside the app; grouping and filtering by game, date and Favourite; Copy's CF_HDROP; rename and delete refused for a Clip saving and a growing sample Recording; delete to the Recycle Bin after confirmation; Cleanup off until a confirmed limit, then deleting only the oldest non-Favourites; and a corrupt library.json blocking Cleanup until acknowledged. The builder then browses their real Clips by game, date and Favourite, opens one in the Media Player, pastes one into Discord, renames and deletes one, and sets a Cleanup limit and sees a Favourite kept."
verify = "The automated suite passes against the installed build, and the builder's session confirms each Done-when line."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8"]
after = [10]
hitl = true
risk = "low"
