# Stories of epic-replay-buffer-clips, in build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Tracer: Save Hotkey to a multi-Track Clip from a Memory ring"
description = "Thinnest path through every layer: on target.changed to a game (epic 3) the SessionOrchestrator starts a replay session from one EffectiveSettings snapshot; the encoded video packets and each Track's AAC packets (epic 2) go into a Memory-mode ring of encoded packets in reference-counted native slabs with a keyframe index (AD-8), trimmed to bufferWindow; the Save Hotkey (HotkeyAction save, story 1.9) posts its QPC to the orchestrator, which pins the slabs from the first keyframe inside the Buffer Window up to the last frame with capture QPC <= the press, and a writer remuxes them into a faststart MP4 (AAC-LC 48 kHz, one titled stream per Track, Track 1 default) at <final>.rbpart, renamed to the path from the OutputPathAllocator (story 3.5); clip.saved { path } goes out in Contracts/Capture.cs. The builder plays a game and presses Save. R1 part: start with the Target Game. R4 part: the Clip up to the press. R6 part: the .rbpart and rename."
verify = "The builder plays a detected game for a minute with a three-Track layout, presses the Save Hotkey, and finds a Clip in the game's folder that plays in VLC with every named Track in sync and ends at the press; ffprobe shows the moov atom before mdat."
covers = ["R1", "R4", "R6"]
after = ["1.10", "2.2", "3.3", "3.5"]
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Exact save cut and gapless Reset"
description = "The AD-10 cut: the Clip's last video frame is the last with capture QPC <= the Hotkey QPC and every Track's audio is cut at the Hotkey QPC on AAC frame boundaries, so each Track matches the video within one audio frame. After each save the encoder is asked for a keyframe on the next frame, which starts the next Clip (the Reset), and the GOP is otherwise at most 1 s; the next Clip runs back to the previous press, never past the Buffer Window. Capture never stops at a Reset. A press with less than 1 s since the Reset makes no Clip and is reported as clip.failed { reason: clip-too-short } with no Reset. R4. R5 part: Reset and keyframe."
verify = "Automated tests on a synthetic capture with known frame QPCs: two saves 10 s apart give a 10 s second Clip overlapping the first by at most one frame with no frame missing between them; each Clip's last frame is at or before its press; every Track's length matches the video within one AAC frame; a press 0.5 s after a Reset makes no Clip and reports clip-too-short."
covers = ["R4", "R5"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Replay Buffer lifecycle: Target switch, exit drain and Ignored"
description = "The replay session follows the Target Game: minimizing, alt-tab and windowed mode don't stop or discard it; switching to another Target ends the session and discards its unsaved content before the new one starts (FR-38); when the Target exits or crashes (target.changed { to: null }) the ring keeps its content and accepts saves for 30 s, then is released so nothing is held; a new Target during the drain ends the drain at once; setting Ignored on the Target ends it with no drain. capture.stateChanged reports the replay running, draining or stopped. R1."
verify = "Automated tests with test game processes: killing the Target and pressing Save 20 s later gives a Clip of its last moments; 31 s after the exit the ring's memory is released and a press makes no Clip; switching Targets gives a first Clip in the new game with none of the old game's frames; marking the Target Ignored releases the ring at once."
covers = ["R1"]
after = [2, "3.4"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Save Cooldown, save events and two concurrent writers"
description = "saveCooldown (Immediate) is measured from the accepted press's Hotkey QPC; presses inside it are ignored with no Clip and no event, only a log line, while the ring keeps capturing for the next Clip. On an accepted press the engine emits clip.saving within 250 ms (for epic 5's saving icon), then clip.saved or clip.failed. Up to two Clip writers run at once, each holding its own pins; a press after the cooldown while two are writing fails as clip.failed { reason: save-busy } with no Reset. Writers run at low I/O priority and post completions to the orchestrator. R5 part: the cooldown. R6 part: two writers and the events."
verify = "Automated tests with a slowed fake writer: presses 1 s and 4 s after a save make no Clip and no event; a press at 5.1 s makes one; with two writers blocked, a third press reports save-busy and the next press after they finish saves the same content plus the new; clip.saving arrives within 250 ms of the press in every case."
covers = ["R5", "R6"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Failed saves, retry and the file-being-written signal"
description = "A writer failure (disk full, access denied, a mux error) removes the .rbpart, releases its pins and emits clip.failed { reason } with a short code from Contracts.ErrorCodes (disk-full and the like) for epic 5's message and sound; it doesn't Reset, so the next press retries with the same content plus anything captured since. The writer calls Library.BeginWrite before creating the .rbpart and EndWrite(outcome) after the rename or failure, through a Core port with a no-op implementation until epic-library-cleanup's LibraryActor; epic-recordings reuses the port. R6 part: failure and retry, and the handoff signal."
verify = "Automated tests with an injected writer fault and a full test volume: no .rbpart or .mp4 remains after a failure; clip.failed carries disk-full; the next press yields a Clip that starts where the failed one would have and runs to the new press; BeginWrite and EndWrite are called once each per attempt with the right outcome."
covers = ["R6"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Ring generations and Buffer Window resizing"
description = "A forced encoder restart (device lost, chain rebuild) opens a new ring generation, and a generation boundary counts as a Reset: a Clip holds one generation, and a save within 1 s of a boundary uses the previous generation if it holds at least 1 s. Changing bufferWindow allocates a new ring at the next Reset and releases the old one when its last pin drops, so a save in flight is never cut short. R2 part: any Buffer Window, including very large ones. R5 part: generations."
verify = "Automated tests: a simulated encoder restart mid-capture makes the next Clip start at the restart; a press 0.5 s after the restart saves the previous generation; a Clip saved with a 30 s Buffer Window never holds more than 30 s; a 2 h Buffer Window is accepted; shrinking the window while a save is writing leaves that Clip whole and frees the old ring after it finishes."
covers = ["R2", "R5"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Disk-mode ring"
description = "replayStorage = disk keeps the ring's slabs in a preallocated ring-<generation>.bin under ringPath (default %LOCALAPPDATA%\\<instance>\\ring), sized from the storage estimate, written at low I/O priority, with the same keyframe index, pinning and generations as Memory mode; files of ended generations are deleted when their last pin drops and stale ones are removed at engine start. A mode change applies at the next session. R3 part: Disk mode and identical Clips."
verify = "Automated tests feed the same encoded packet sequence to a Memory and a Disk ring and save at the same QPCs: the two Clips are byte-identical; disk use stays within the estimate over a 10-minute synthetic run; a ring file left by a killed engine is removed at the next start."
covers = ["R3"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Memory-mode RAM margin"
description = "In Memory mode the ring stops growing when Windows' available physical memory would drop below the larger of 4 GB and 15% of installed RAM; it then drops its oldest unpinned slabs first, counting pinned bytes, so Clips get shorter than the Buffer Window. Entering the margin raises warning.raised { code: memory-margin } once (and again only after leaving it), for epic 5's status line; an unpinned ring under 1 s raises it too. R3 part: the margin."
verify = "Automated tests with a fake memory-status source: lowering available memory below the margin stops growth and drops the oldest unpinned slabs, never pinned ones; one memory-margin warning is raised per entry into the margin; a Clip saved meanwhile holds the newest content and is shorter than the Buffer Window."
covers = ["R3"]
after = [7]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "Per-Game-Profile settings at the next Reset"
description = "The replay session re-resolves EffectiveSettings (Core Resolve) for the active Game Profile at each Reset, so a profile's trackLayout, video and bufferWindow overrides, and later edits to them, apply from the next Clip. When the change alters the ChainKey, the orchestrator builds the next encoder chain in advance and switches at the press frame, raising warning.raised { code: reset-gap } only if a gap can't be avoided; the encoder budget of two chains holds. A profile's own Track Layout carries its own Mic Devices and mute Tracks, so mic mute (story 2.4) silences only the active layout's Mic Devices in its muteAffected Tracks. R7. R8 engine part."
verify = "Automated tests: a profile with a 1080p override records 1080p while another game records the Global resolution; changing a profile's Track Layout mid-session leaves the current Clip's Tracks and gives the next Clip the new ones, with no gap; a profile marking only its own mic as a Mic Device mutes that mic, not the Global one, in its muteAffected Tracks."
covers = ["R7", "R8"]
after = [8, "2.4"]
hitl = false
risk = "high"

[[entry]]
id = 10
type = "story"
title = "Replay Buffer and Output Settings page with the storage estimate"
description = "A Replay Buffer page in the Settings host (story 1.7), sent through its settings.update sender: Buffer Window (any length of at least 1 s), Memory or Disk with the ring folder, Save Cooldown, and the Global Output Settings from story 1.10's offers (codec with the may-not-play-everywhere label, resolution, frame rate up to 120, bitrate, CBR or VBR). A Core estimate (video bitrate, or 1.5x its peak for VBR, plus each Track's AAC bitrate, times the Buffer Window, plus ring overhead) updates as soon as any of those or the Track count changes, labelled worst case for VBR, and warns without blocking when it exceeds free RAM or free space on the ring's drive. There is no separate UX design; the builder checks the page by hand. R2 part: the estimate and warning."
verify = "An automated test compares the estimate to the measured ring size after a 5-minute CBR synthetic run and finds it within 20%; the builder changes the Buffer Window, bitrate and storage mode and sees the estimate update at once, sets a value larger than free space and sees the warning while saving still works."
covers = ["R2"]
after = [8]
hitl = true
risk = "medium"

[[entry]]
id = 11
type = "story"
title = "Game Profile overrides in the Main App"
description = "Each Game Profile on the Game Profiles page (story 3.6) gains its own settings: a Track Layout override edited with epic 2's editor (story 2.7) including Mic Devices and mute Tracks (story 2.11), started as a copy of Global's that keeps the Track ids; Output Settings and Buffer Window overrides; and Use Global for each, which removes the override. Every change goes through the settings.update sender as profile-scoped ops. There is no separate UX design; the builder checks the page by hand. R7 part: the UI. R8 part: per-profile marking."
verify = "The builder gives one game a 1080p override and its own Track Layout with a different Mic Device, saves a Clip in that game and in another, and finds each with its own resolution and Tracks; muting in the first game silences only its Mic Device; Use Global removes the override."
covers = ["R7", "R8"]
after = [9, 10, "2.11", "3.6"]
hitl = true
risk = "medium"

[[entry]]
id = 12
type = "story"
title = "Hotkeys page in the Main App"
description = "A Hotkeys page in the Settings host (after story 10, which also adds a page there) listing every HotkeyAction (save, micMute, recordToggle, recordStart, recordStop, monitorRecordToggle, plus recordHotkeyMode) with its binding, set by pressing a combination; duplicates are refused before saving (the engine also refuses them with hotkey-duplicate); each Hotkey's hotkey.status is shown, so a combination another app owns is marked failed while the others keep working; bindings apply as soon as the change commits. There is no separate UX design; the builder checks the page by hand. R9."
