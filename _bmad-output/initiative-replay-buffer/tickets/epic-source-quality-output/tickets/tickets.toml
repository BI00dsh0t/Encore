# Stories of epic-source-quality-output, in build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Tracer: the matchSource key and a game chain at the source size"
description = "The thinnest path through every layer, set with settings.update and no page yet. Contracts, additively (AD-22): VideoSettings gains an optional MatchSource (JSON matchSource, default false); IsValidVideo is unchanged, so width and height stay required as the fallback size. Core: a pure SourceOutputSize rule: null under 640×360, else MonitorCanvasRule.Fit(w, h, MonitorCanvasRule.MaxSide(codec)), which already rounds down to even sides and keeps the aspect (H.264 4096, HEVC and AV1 8192). Engine: with matchSource on, the game capture chain takes its output size from the first frame's content size. EncoderChain.OutputSize is fixed today in its constructor from the snapshot, while CaptureSession.StartOutput calls Build at the first frame (OnFrame); so with matchSource on the size is resolved in StartOutput before Build, and the D3D11VA frame pool and FrameScaler are created in Build at that size. With it off, nothing changes. The FrameScaler then copies at 1:1, and StartOutput's log line shows the output size. Frame rate, codec, bitrate and rate control stay from the snapshot. The Replay Buffer and a game Recording share the chain as today. R1, R2."
verify = "Automated tests: a VideoSettings without matchSource reads as false and round-trips through settings.update with it true, and an old settings.json still loads; the size rule gives 2560×1440 for 2560×1440, 4096×1152 for 5120×1440 under H.264, and null for 600×300; with a fake capture source of 2560×1440 and matchSource on, the chain's output size is 2560×1440 and the fps is the snapshot's. Heavy (explicit, at night): a real 30 s capture of a 2560×1440 window with matchSource on gives a 2560×1440 file at the Output frame rate that plays to the end, and the engine log's anchor line reads 'output 2560x1440'."
covers = ["R1", "R2"]
after = ["11.5"]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Architecture: AD-26, the source output size"
description = "A spine edit under AD-22, run by the coordinator as an architecture update session (as with AD-25), before story 2 builds on it: a new AD-26 'Source output size' binding R20, R40 (and pointing from AD-7 and AD-25): with video.matchSource, a game chain's output size is the content size at its first frame, fitted by MonitorCanvasRule.Fit to the codec's largest side, null under 640×360, codec never switched; a one-screen Monitor Recording takes its screen's physical mode through MonitorCanvasRule.Plan; a size change held 3 s moves the Replay Buffer's chain through AD-7's build-ahead switch, started by the engine rather than a ChainKey comparison, never during a Recording, which letterboxes (R12). No code."
verify = "AD-26 is in the architecture file with its Binds, Prevents and Rule, AD-7 and AD-25 point to it, and the epic's Notes link it."
covers = ["R2", "R3", "R4"]
after = []
hitl = true
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Size changes mid-session, and one-screen Monitor Recordings at source size"
description = "Engine, with matchSource on. Game capture: a content size that differs from the chain's and holds for 3 s (the window under 640×360 ignored) moves the Replay Buffer to a chain at the new size through AD-7's build-ahead switch, as at a Reset; the move is started by the engine on the held size change, not by a ChainKey comparison, since with matchSource on the key's width and height are only the fallback and don't change; raising reset-gap if a gap can't be avoided; the next Clip starts at the move. While a game Recording runs, the size stays and the content is letterboxed (R12), and the move waits for the Recording to end. A GPU reset rebuilds at the current size (8.3). Monitor Recording: one screen records at its physical mode size (EnumDisplaySettings, as AD-25's canvas reads it) through MonitorCanvasRule.Plan, so a screen over 4096 px under H.264 takes AD-25's switch to HEVC or AV1 as a multi-screen canvas does; several screens keep AD-25's canvas unchanged. Cost: one bench fps run on the synthetic load with the Replay Buffer at 2560×1440 source size, recorded in the epic's Notes against NFR-1 and the 1080p baseline. Builds on AD-26 (entry 6). R3, R4."
verify = "Automated tests with a fake capture source: a size change held 3 s moves the chain to the new size and a later Clip has it; a change held under 3 s, or to under 640×360, doesn't; a change during a Recording keeps the Recording's size in one file and moves after it stops; a one-screen Monitor Recording with a fake 3840×2160 display mode is sized 3840×2160. Heavy (explicit, at night): a real window resized from 1280×720 to 2560×1440 gives a Clip at 2560×1440, a one-screen Monitor Recording of the 3840×2160 screen comes out at that size, and the bench fps result is in the Notes."
covers = ["R3", "R4"]
after = [1, 6]
hitl = false
risk = "high"
plan_checkpoint = true

[[entry]]
id = 3
type = "story"
title = "Source in the Video quality section"
description = "ReplayBufferSettingsPage's Video quality section, on the Clips page and on a game's page (the same view model, IsProfile): 'Source — the game's or screen's own size' first in the Resolution list. Choosing it sends video with matchSource true and the current width and height kept; choosing a fixed size sends matchSource false with that size. With Source chosen, a help line says what it records at, that frame rate and bitrate still apply, and with H.264 that anything over 4096 px is scaled down; 'Use the main video quality' on a game's page works as today. In both themes, to epic 10's glossary. R5."
verify = "Automated tests on the page's view model: choosing Source sends matchSource true with the size kept, choosing 1920×1080 after it sends matchSource false; a game page's override and its reset to the main setting carry matchSource; the H.264 line shows only for H.264. The view loads in both themes with no missing resource."
covers = ["R5"]
after = [1]
hitl = false
risk = "low"

