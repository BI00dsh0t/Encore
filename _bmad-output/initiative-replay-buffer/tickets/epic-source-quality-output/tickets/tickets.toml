title = "Source-resolution output end to end on the builder's PC"
description = "The closing end-to-end check of the epic's Done when, integrated: an automated suite against the installed build on a dev instance sets video.matchSource globally and for one game, saves a Clip and a Recording of a synthetic game window at 2560×1440 and after a resize, starts a one-screen Monitor Recording, and checks each file with ffprobe (size, the Output frame rate, every Track, plays to the end); a fixed size still gives that size. GPU parts are Heavy and run at night. The builder then chooses Source on the Clips page, plays a game, saves a Clip and records a few minutes, pastes the Clip into Discord, and checks the page in both themes."
verify = "The automated suite passes against the installed build, and the builder's session confirms each Done-when line."
