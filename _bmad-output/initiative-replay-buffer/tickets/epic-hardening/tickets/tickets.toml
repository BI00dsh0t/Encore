description = "The closing end-to-end check of the epic's Done when, integrated: an automated suite against the installed build kills the engine and the App during a synthetic game and checks the restart notices and an injected save after each, runs the persistence suite, a 20-minute soak, and the simulated driver reset, sleep and monitor change, and confirms the conformance record has no open row. The builder then works through the epic's Human Check rows: reboots and plays with nothing to re-select, restarts the BEACN app mid-game, kills the engine in a game and sees the status line report it, forces a driver reset, sleeps and wakes, unplugs a monitor, and repeats the FPS run in their game. Finally they uninstall ShadowPlay and the month of use begins."
