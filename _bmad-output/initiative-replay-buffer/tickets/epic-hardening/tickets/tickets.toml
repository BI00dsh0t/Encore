# Stories of epic-hardening, in build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Tracer: a soak harness and a 20-minute soak report"
description = "Thinnest path through every layer: a soak command in ReplayBuffer.Bench (story 1.14) launches the installed engine and App as separate processes (Bench never references them, AD-2) on a dev instance, opens Bench's synthetic game window and adds it as a game by hand so it becomes the Target Game, and presses the Save Hotkey on a schedule with injected keys (as 1.14's hotkey run does). Every 10 s it samples each process's private bytes, working set, handle count and GDI and USER object counts (GetProcessMemoryInfo, GetProcessHandleCount, GetGuiResources), and it checks every Clip with ffprobe: every Track of the Track Layout present and named, length within one frame of the Buffer Window, and the file decodes to the end. It writes a report (CSV samples, a per-Clip table, and pass or fail against the epic's soak bounds) to a run folder. Options set the duration, the Replay Buffer mode and the press interval; story 2 adds the kill options and story 8 the Recording, Cleanup, ring-size and drift extras. A 20-minute Memory-mode run writes a passing report. R1 part: the harness."
verify = "Automated tests: the sampler reads a known test process's counters; the bound check passes a flat series and fails one growing 3 MB per hour or 60 handles; the Clip checker fails a file missing a Track or cut short. A 20-minute bench soak run against the installed build writes a report with every Clip passing and the bounds met."
covers = ["R1"]
after = ["1.14", "4.14"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Engine crash recovery and the restart warnings"
description = "Make a crash invisible except for its notice (AD-16, NFR-5, PLAN.md T-17, T-18), on story 1.8's supervision: the App relaunches a crashed or hung engine with --restarted crashed|hung, and the new engine raises warning.raised { code: engine-restarted, dismissable } before its first snapshot, so story 5.10's status line shows it; the engine raises app-restarted when it relaunches an App that died. On start the engine restores mic mute (AD-5), registers the Hotkeys, runs Game Detection on the games already running so the Replay Buffer resumes on the Target Game, raises recording-interrupted for a Recording left open (story 6.2) and reconciles the Library (story 7.2). After 3 restarts within 10 minutes the supervisor stops, the tray shows an error state with a Restart item, and engine-crash-loop is logged; the engine stops relaunching a crash-looping App the same way and logs app-crash-loop (new codes in Contracts.ErrorCodes). A hang is simulated by a dev.simulate engine-hang event (story 5.4), refused outside the dev instance (NFR-3). The bench soak gains --kill-engine and --kill-app options for later stories. R2."
verify = "Automated tests against the installed build with a synthetic game: killing the engine has the Replay Buffer buffering again within 10 s with engine-restarted in the snapshot and an injected Save Hotkey saving a playable Clip; a hung engine (dev-only hang command) is back within 20 s; killing it during a Recording leaves a file that plays to its last fragment and raises recording-interrupted; with the App killed an injected press still saves, and the App returns with app-restarted; a fourth crash within 10 minutes isn't relaunched and the tray shows the error state; a fourth App crash within 10 minutes isn't relaunched either."
covers = ["R2"]
after = [1, "5.10", "6.2", "7.2"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "GPU driver reset recovery"
description = "Survive PLAN.md T-01 without an engine restart: any D3D11, DXGI or encoder call returning DXGI_ERROR_DEVICE_REMOVED or DXGI_ERROR_DEVICE_RESET reports a device-lost event to the SessionOrchestrator (AD-19), which tears down the WGC items, the D3D11 device and the encoder chains, rebuilds them on the Target Game's adapter (retried every 2 s for up to 60 s), and opens a new ring generation (story 4.6), so a save afterwards still holds the content buffered before the reset; a running Recording follows story 6.6's restart into a new file, and a Monitor Recording the same way. Each reset raises warning.raised { code: gpu-reset, overlay: false }; giving up raises gpu-reset-failed and stops the Replay Buffer until the next Target (new codes in Contracts.ErrorCodes). A dev-instance-only fault seam (dev.simulate gpu-reset, story 5.4) makes the next device call fail. A real reset, which needs elevation (dxcap -forcetdr), is a Human Check. R3."
verify = "Automated tests with the fault seam on a synthetic game: after a simulated reset the Replay Buffer is buffering again within 5 s, a press saves the pre-reset content as a playable Clip of its generation, a running Recording continues in a second playable file, and gpu-reset is raised; a seam that keeps failing ends in gpu-reset-failed after 60 s with the engine still running. The builder forces a real reset with dxcap -forcetdr during a game and saves a Clip after it."
covers = ["R3"]
after = [2, "4.6", "6.6", "6.9"]
hitl = true
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Sleep, resume and the secure desktop"
description = "PLAN.md T-02 and T-04: the engine registers for power notifications (RegisterSuspendResumeNotification) behind a Core port. On PBT_APMSUSPEND it closes the current ring generation (it stays saveable), ends a running Recording cleanly at its last fragment, and stops the audio clients and capture; on PBT_APMRESUMEAUTOMATIC it rebuilds them through story 2.5's device rebinding and opens a new generation, so no packet's timestamp spans the sleep and none is negative. The Recording ends with recording.stopped { reason: suspend } and warning.raised { code: recording-suspended } (new in Contracts.ErrorCodes), and is not restarted (only the Replay Buffer resumes, as after an engine restart). The lock screen, a UAC prompt and Ctrl+Alt+Del are a static screen to the capture: the pacer (story 1.11) repeats the last frame while WGC delivers none, audio continues, and there is no generation break unless the format changes. Tests drive the power port and a frame-starved source; a real sleep, lock and UAC prompt are Human Checks. R4."
verify = "Automated tests: injected suspend and resume close one generation and open the next with monotonic timestamps on every stream and no gap or jump inside either, a save after resume is playable, and a running Recording ends playable; a capture source delivering no frames for 60 s keeps the configured frame rate with audio in sync and no new generation. The builder sleeps and wakes the PC during a game, locks it, and triggers a UAC prompt, then saves a Clip after each."
covers = ["R4"]
after = [3, "2.5", "6.2"]
hitl = true
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Monitor changes"
description = "PLAN.md T-03: the engine and the App follow display changes (WM_DISPLAYCHANGE and the monitor list) without a crash. Game capture is of the Target Game's window, so it continues; the Overlay is re-placed by story 5.1's rule on the Target Game's monitor (else the primary) at that monitor's DPI; a Monitor Recording whose monitor is removed ends at its last frame with warning.raised { code: monitor-removed } (new in Contracts.ErrorCodes) and its file kept, one whose monitor stays continues (story 6.10's ACCESS_LOST handling for Desktop Duplication), and monitors.list (story 6.11) emits the new list so the picker updates. Tests use a fake monitor list behind a new Core display port with a Platform.Desktop adapter; plugging and unplugging a monitor and changing the primary are Human Checks. R5."
verify = "Automated tests with a fake display port: a removed secondary monitor during a Monitor Recording of it ends the Recording with a playable file and monitor-removed; a removed monitor not being recorded changes nothing but the list; a primary change re-places the Overlay; game capture of a synthetic game continues through each change. The builder unplugs and replugs a monitor and changes the primary during a game and a Monitor Recording."
covers = ["R5"]
after = [4, "5.8", "6.10", "6.11"]
hitl = true
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Nothing to re-select after a reboot, a restart or a mixer restart"
description = "Prove and fix R35 (NFR-6, PLAN.md T-05 to T-07): an automated persistence suite on a dev instance snapshots settings.json, the Game Profiles, the Track Layouts' device ids, the Hotkeys, runtime.json's mic mute and library.json's Favourites, then restarts the App, restarts the engine, and restarts both through Quit and a launch from the Run key's command line, and checks each is unchanged and the Replay Buffer starts by itself when a synthetic game appears. With a fake device hub it removes and recreates a Track's endpoints under the same id and under a new id with the same names (story 2.5's rebind), and changes the default device, and checks each Track keeps its devices with silence only during the gap and settings unchanged. Anything that needs re-selecting is fixed here when it is persistence, or becomes a bugfix against the owning story. The reboot and a real BEACN restart are Human Checks. R6."
verify = "The automated suite passes against the installed build: every persisted value matches after each restart, the Replay Buffer starts on a synthetic game after each, recreated endpoints rebind with the Track Layout unchanged on disk, and a default-device change leaves every Track's devices alone. The builder reboots, starts a game, and saves a Clip with every Track without opening the Main App, then restarts the BEACN app during a game and saves another."
covers = ["R6"]
after = [5, "1.13", "2.5", "3.4", "7.4"]
hitl = true
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Final conformance run"
description = "Story 1.14's benchmark, rerun against the finished, hardened app with everything on (R33, R36 final part, PLAN.md T-15, T-24): bench drift, which ran debug-capture on a marker window in 1.14, is extended to drive the installed App and engine and record a real 30-minute Recording (halved by the builder, 2026-11-04) with the Replay Buffer, the Overlay, the Library and Cleanup running and a Track Layout using every Track the builder uses (several BEACN devices on independent clocks), and measures A/V and Track-to-Track drift against one frame; bench fps --overlay (story 5.12), at half its usual length (3 balanced passes of about 2.5 minutes each, by the builder, 2026-11-04), measures FPS loss on the synthetic GPU load with a Recording running too, against the NFR-1 target; bench playback checks an H.264 Clip and Recording in Discord, Chrome, VLC, Windows Media Player and DaVinci Resolve with every Track present, named and in sync, and an HEVC and an AV1 Clip, where the GPU encodes them, in the players that support them. The results go to the epic's Notes; whether the provisional 3% stands (Q-1) goes to the builder. The runs in a real GPU-bound game and the players Bench can't script are Human Checks. R7."
verify = "The automated runs pass against the installed build: drift under one frame over 30 minutes on every Track, FPS loss on the synthetic load within the target, and every scripted player opening each file with every Track; the report is in the epic's Notes. The builder repeats the FPS run in their GPU-bound game and checks the unscripted players."
covers = ["R7"]
after = [6, "2.9", "5.12", "6.13", "7.11", "9.9"]
hitl = true
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "8-hour soaks in Memory and Disk mode"
description = "The R1 soak (NFR-5, PLAN.md T-15, T-16, T-17) against the hardened, finished app, unattended on the builder's PC: two 8-hour bench soak runs, Memory mode then Disk mode, on the synthetic game window without GPU load, with the builder's real Audio Devices (silent loopbacks included), the Save Hotkey every 5 minutes with jitter, a 10-minute Recording each hour, the Overlay on, a Cleanup size limit the run crosses, and the App killed once in the last hour with story 2's --kill-app option, after its growth is measured, followed by a press that must still save. The harness adds the Disk-mode ring file's size and the drift between two devices on independent clocks at the end. Each growth the bounds catch is diagnosed (a dump or allocation trace) and fixed here, or becomes a bugfix against the owning story and the run is repeated. A soak in a real game is a Human Check. R1."
verify = "Both 8-hour reports pass: every Clip and Recording checks out with every Track, each process meets the memory, handle, GDI and USER bounds, the Disk ring file's size never changes, two-clock drift is under one frame at the end, Cleanup removed only non-Favourites, and the press after the App was killed saved a Clip; the reports are linked from the epic's Notes."
covers = ["R1"]
after = [7, "6.13", "7.11"]
hitl = false
risk = "high"

