description = "A Recordings page in the Settings host (after story 5.11, which also adds a page there) with the monitor for Monitor Recording (monitorRecordingMonitor) picked from a new monitors.list command (Contracts/Recording.cs: device name, friendly name, resolution, primary), Primary monitor first; story 4.12's Hotkeys page gains the monitorRecordStart and monitorRecordStop rows, shown for the mode recordHotkeyMode selects. Changes go through the settings.update sender. There is no separate UX design; the builder checks it by hand. R6 part: choosing the monitor."
