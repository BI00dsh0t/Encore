[[entry]]
id = 13
type = "story"
title = "Recordings end to end on the builder's PC"
description = "The closing end-to-end check of the epic's Done when, integrated: an automated suite drives the installed engine and App with injected Hotkeys against the synthetic game window and checks, with ffprobe and decoded frames: Record presses ignored with Recordings off, both Hotkey modes, the solid dot and both sounds, Clips saved mid-Recording with no glitch in either, the game's exit finishing a complete file, ten engine kills each losing at most 1 s in sync, a 4-hour real-time Recording as one file, a forced encoder restart giving two playable files, a filled test volume stopping the Recording with a playable file, the red X and the sound, a Monitor Recording with and without a game and with none of the App's windows, and BeginWrite and EndWrite for every Recording. The builder then records a real game session of at least 30 minutes with Clips saved during it, exits the game, plays the files in VLC and DaVinci Resolve, and makes a Monitor Recording of a second monitor; a power cut mid-Recording is an optional check for the builder."
verify = "The automated suite passes against the installed build, and the builder's session confirms each Done-when line."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8"]
after = [12]
hitl = true
risk = "low"
