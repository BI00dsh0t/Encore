# Stories of epic-recordings, in build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Tracer: Record Hotkey to a fragmented MP4 Recording beside the Replay Buffer"
description = "Thinnest path through every layer: in the Target Game with its Game Profile's recordingsEnabled on (story 3.6's switch), a recordToggle press posts its QPC to the SessionOrchestrator, which reads one EffectiveSettings snapshot (AD-5) and attaches a Recording sink to the Replay Buffer's encoder chain when the ChainKey matches (AD-7), asking the encoder for a keyframe on the next frame and starting every Track's audio at that frame's QPC. A RecordingWriter (Media, over Platform.FFmpeg's fragmented MP4 muxer) writes the video and one titled AAC stream per Track (Track 1 default) in place, at low I/O priority, to the path the OutputPathAllocator (story 3.5) allocates from the start QPC, calling Library.BeginWrite before creating the file and EndWrite(outcome) after its final flush through story 4.5's port. A second press finishes the file. capture.stateChanged reports recording: running then off, so epic-overlay-feedback's Overlay shows the solid dot; recording.started { path } and recording.stopped { path, reason } go out in Contracts/Recording.cs. The builder records a minute of a game and plays the file. R1 part: the toggle and the gate. R2 part: beside the Replay Buffer. R8 part: BeginWrite and EndWrite."
verify = "Automated tests with a synthetic game window and a fake Hotkey: two presses 60 s apart give one .mp4 in the game's folder that ffprobe reads as fragmented MP4 with one video and one stream per Track, about 60 s long, starting on a keyframe; BeginWrite and EndWrite are called once each; capture.stateChanged goes running then off; with recordingsEnabled off a press changes nothing. The builder records a minute of a game with a three-Track layout and plays it in VLC with every named Track in sync."
covers = ["R1", "R2", "R7", "R8"]
after = ["4.5", "5.1", "3.6"]
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Crash-safe Recordings and recording-interrupted"
description = "Make a killed Recording lose at most 1 s with every Track in sync (FR-12, PLAN.md T-18): the RecordingWriter cuts a fragment at least every 1 s with every Track interleaved in it (audio held back so no Track's fragment runs ahead of the video), writes it whole, then calls FlushFileBuffers before the next, at low I/O priority and off the orchestrator thread. The file's moov is written at start (empty_moov) so a file cut off after any fragment plays. After an engine restart no Recording resumes (AD-16): on start the engine finds the Recordings the previous instance left open (BeginWrite with no EndWrite, kept in runtime.json beside the mic mute) and raises warning.raised { code: recording-interrupted } for each with its path, overlay and dismissable. R3. R1 part: no resume after a restart."
verify = "An automated test starts a Recording of the synthetic game window with a three-Track layout, kills the engine process at a random point 20 to 90 s in, ten times, and for each file: ffprobe opens it, every Track is present, the last video and audio timestamps are within 1 s of the kill QPC, and each Track matches the video within one AAC frame; the restarted engine raises one recording-interrupted per run and starts no Recording. A muxer test truncates a file after each fragment boundary and every truncation plays."
covers = ["R1", "R3"]
after = [1, "2.4"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Record Hotkey modes and the Recordings switch"
description = "global.recordHotkeyMode picks toggle (recordToggle) or separate (recordStart does nothing while a Recording runs, recordStop nothing while none does); the bindings of the unused mode are ignored, and a mode change applies as soon as it commits. The Game Profile's recordingsEnabled is read live at each press (AD-5): off, every Record press is ignored with only a log line, no event and nothing on the Overlay; switching it on starts nothing; switching it off while a Recording runs leaves that Recording running until it is stopped. Presses with no Target Game do nothing. R1."
verify = "Automated tests with a fake Hotkey source: in toggle mode press, press gives start, stop; in separate mode Start twice gives one Recording and Stop with none running gives nothing; changing the mode mid-session switches which actions act; with recordingsEnabled off no press starts a Recording or emits an event; switching it on starts nothing; switching it off mid-Recording doesn't stop it; a press with no Target does nothing."
covers = ["R1"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Recording lifecycle: game exit, Target hold, Ignored and Quit"
description = "The Recording follows the Target Game (AD-18, AD-19): target.changed { reason: exit } stops it and finishes a complete file in the game's folder, with recording.stopped { reason: game-exit }; setting the Target Ignored stops it the same way (reason: ignored). A running game Recording holds the Target: the orchestrator's real Recording state replaces story 3.3's stub flag, so a 10 s focus switch waits and is re-evaluated the moment the Recording stops. Minimizing, alt-tab and windowed mode never stop it. Tray Quit (engine.shutdown) finishes the file within its 5 s wait (reason: shutdown). The file appears under the game: BeginWrite carries the profileId. R2 part: game exit and the Target hold. R8 part: the stub's replacement."
verify = "Automated tests with two test game processes: killing the Target mid-Recording gives a complete file that ffprobe reads to its end and a recording.stopped with game-exit; with a Recording running, 15 s of focus on the other game doesn't switch the Target, and stopping the Recording switches it at once; marking the Target Ignored stops the Recording; engine.shutdown finishes the file within 5 s."
covers = ["R2", "R8"]
after = [3, "3.3", "3.4"]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Clips during a Recording on one encoder chain"
description = "A Recording and the Replay Buffer share the chain (AD-7) and never disturb each other (FR-10): a Clip save's forced keyframe and Reset reach the Recording as an ordinary keyframe with no gap, duplicated or dropped frame; the Save Cooldown, failed saves and two writers (stories 4.4, 4.5) touch only Clips. While a game Recording runs, the Replay Buffer defers a pending settings change that would alter its ChainKey (a Game Profile override edit, story 4.9) to the first Reset after the Recording stops, so the two keep one chain and a Monitor Recording still fits the two-chain budget; a deferred change is logged. A Recording started while such a change is pending shares the Replay Buffer's current chain and settings, and the change waits for the Recording as above. R2 part: no glitch either way."
verify = "Automated tests on the synthetic game window: during a 2-minute Recording, ten saves at random times give ten correct Clips, and the Recording's decoded frame stamps show no gap, duplicate or drop beyond the pacer's constant rate and its audio has no discontinuity at any save; changing the profile's resolution mid-Recording keeps one encoder chain until the Recording stops, then the next Clip uses the new resolution; a Recording started with a resolution change pending records at the current resolution on the shared chain."
covers = ["R2"]
after = [4, "4.4", "4.9"]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "One file however long, and forced encoder restarts"
description = "A Recording stays one file whatever happens to the game (FR-13, FR-22): a resolution or fullscreen-to-borderless change goes through story 1.11's fixed output scaler with no break. A forced encoder restart (device lost, chain rebuild; story 4.6's ring generation) ends the Recording cleanly at the last frame of the old chain and starts a new Recording at once on the new chain, in a new file from the allocator, raising warning.raised { code: recording-restarted, overlay: true, sound: recordingStarted } that names both files, with recording.stopped { reason: encoder-restart } and recording.started for the new one. Both files play. R4."
verify = "Automated tests: 4 hours of synthetic encoded packets with three Tracks fed through the RecordingWriter faster than real time give one file that ffprobe reads as 4 hours with every Track the same length within one AAC frame; changing the synthetic window's resolution mid-Recording keeps one file; a simulated encoder restart gives two playable files whose stamps meet with no gap larger than the restart and one recording-restarted warning."
covers = ["R4"]
after = [5, "4.6"]
hitl = false
risk = "high"

[[entry]]
id = 7
type = "story"
title = "Disk full during a Recording"
description = "When a Recording's write fails with a full disk (FR-14), the RecordingWriter truncates the file to the end of its last complete fragment, closes it and calls EndWrite(disk-full); the orchestrator stops the Recording (recording.stopped { reason: disk-full }) and raises warning.raised { code: disk-full, severity: error, overlay: true, sound: diskFull, dismissable: true } through story 5.4's mapping, so the Overlay shows the red X (story 5.7). The engine dismisses it when the next Recording starts. A Memory-mode Replay Buffer keeps running. A Disk-mode one stops, raising replay-stopped-disk-full (overlay: true), and restarts by itself once the ring's drive has room for the ring again, checked every 30 s. New codes go in Contracts.ErrorCodes. R5."
verify = "Automated tests on a small test volume (a VHD) filled during a Recording: the file plays with every Track up to its last fragment; one disk-full warning is raised and is dismissed when the next Recording starts; the Memory-mode Replay Buffer still saves a Clip afterwards; with a Disk-mode ring on the same volume the buffer stops with replay-stopped-disk-full and restarts within 30 s of space being freed."
covers = ["R5"]
after = [6, "4.7", "5.4", "5.7"]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Recording notices and sounds"
description = "The FeedbackRouter (story 5.4) maps the real recording.started and recording.stopped events to its recording-started and recording-stopped notices and sounds, the stop message giving the reason (stopped, game exited, disk full, encoder restart, shutdown), so the dev.simulate stub Recording is no longer needed for them; a stop for disk full plays only the disk-full sound, and an encoder restart only recording-restarted's. The solid dot follows capture.stateChanged from the real state. R7."
verify = "Automated tests with a fake render port: each start plays recordingStarted once and raises recording-started; each stop reason raises recording-stopped with its reason in the message and plays recordingStopped, except disk-full and encoder restarts, which play only their own sound; capture.stateChanged reports running for the whole Recording. The builder starts and stops a Recording in a game and hears both sounds."
covers = ["R7"]
after = [7, "5.6"]
hitl = true
risk = "low"

[[entry]]
id = 9
type = "story"
title = "Monitor Recording by its own Hotkey"
description = "monitorRecordToggle, and new monitorRecordStart and monitorRecordStop Hotkey actions (unbound by default, following recordHotkeyMode, added additively to HotkeyAction and global.hotkeys under AD-22), start and stop a Monitor Recording of global.monitorRecordingMonitor (null is the primary monitor) with a WGC monitor item in Platform.Capture (AD-12), with or without a Target Game. It reads the Global Settings only (Global Track Layout and Output Settings, AD-5) on its own encoder chain within the two-chain budget, subscribes to the AudioDeviceHub's fan-out for its Tracks, and writes with story 1's RecordingWriter, so crash safety, disk full and the notices apply unchanged; the path is in the reserved Monitor Recordings folder (AD-21) and BeginWrite has no profileId. It never holds or follows the Target Game, never starts by itself, and capture.stateChanged reports monitorRecording. After an engine restart a Monitor Recording doesn't resume, and raises recording-interrupted as in story 2. The orchestrator enforces the two-chain budget (AD-7), refusing a third chain with encoder-budget (new in Contracts.ErrorCodes); while a Monitor Recording runs, a Replay Buffer chain change at a Reset tears down the old chain before building the new one, raising reset-gap, instead of building it in advance. The app's own windows are already excluded from capture (story 5.9). R6 part: the Hotkey, the WGC capture and the folder."
verify = "Automated tests: a toggle press with no game running gives a Monitor Recording in Monitor Recordings that ffprobe reads with every Global Track; a Monitor Recording runs alongside a Replay Buffer and a game Recording on the synthetic game window, with two encoder chains, and a Target switch neither stops nor waits for it; separate mode's Start and Stop act as for Recordings; a WGC capture of the monitor with the Main App and Overlay open has none of their pixels; killing the engine mid-Monitor-Recording leaves a playable file losing at most 1 s, and the restarted engine raises one recording-interrupted and starts no Monitor Recording; a Monitor Recording on a filled test volume stops with a playable file and a disk-full warning; requesting a third chain is refused with encoder-budget; a Reset that changes the ChainKey during a Monitor Recording never runs three chains."
covers = ["R6"]
after = [8, "5.9"]
hitl = false
risk = "medium"

[[entry]]
id = 10
type = "story"
title = "Desktop Duplication fallback for Monitor Recording"
description = "When a WGC monitor item can't be created or fails at start (AD-12), the Monitor Recording captures the same monitor with DXGI Desktop Duplication in Platform.Capture, behind the same Core source port, stamping frames with QPC (AD-6) and feeding story 1.11's pacer and scaler, so the file is the same; desktop switches and mode changes (ACCESS_LOST) recreate the duplication without ending the Recording. A one-time warning.raised { code: monitor-capture-fallback, overlay: false } says which path is in use. App windows stay excluded (WDA_EXCLUDEFROMCAPTURE also applies to Desktop Duplication). Never used for game capture. R6 part: the fallback."
verify = "Automated tests with the WGC path forced to fail: a Monitor Recording through Desktop Duplication plays with every Track in sync and a constant frame rate; a simulated ACCESS_LOST mid-Recording keeps one file; the Main App's pixels are absent from the captured frames; game capture never selects Desktop Duplication."
covers = ["R6"]
after = [9]
hitl = false
risk = "medium"

