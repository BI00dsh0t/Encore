function closeMenu(){q('rb-export-menu').hidden=true;q('rb-export-arrow').setAttribute('aria-expanded','false');}
function render(){
root.dataset.sidebarExpanded=String(state.sidebarExpanded);q('rb-nav-toggle').setAttribute('aria-expanded',String(state.sidebarExpanded));q('rb-nav-toggle').setAttribute('aria-label',state.sidebarExpanded?'Collapse navigation':'Expand navigation');q('rb-nav-toggle').dataset.tooltip=state.sidebarExpanded?'Collapse navigation':'Expand navigation';
root.style.setProperty('--player-height',design.playerHeight+'px');root.style.setProperty('--lane-height',design.laneHeight+'px');
const audio=state.type==='audio',len=(state.end-state.start).toFixed(3)+' s';q('rb-export-label').textContent=audio?'Export audio':'Export video';q('rb-modal-title').textContent=audio?'Export audio':'Export video';q('rb-format-desc').textContent=audio?'MP3 · Stereo · 48 kHz / 192 kbps':'MP4 · H.264 video / AAC audio · Source resolution';q('rb-separate-label').textContent=audio?'Separate MP3 files':'Separate audio tracks';q('rb-save-label').textContent=audio?'Save audio…':'Save video…';q('rb-start').value=fmt(state.start,true);q('rb-end').value=fmt(state.end,true);q('rb-duration').textContent=len;q('rb-export-duration').textContent=len;q('rb-export-range').textContent=fmt(state.start)+' → '+fmt(state.end);q('rb-zoom').textContent=state.zoom+'×';q('rb-preview-tag').textContent=state.preview?'SELECTION PREVIEW':'SOURCE';q('rb-playtime').textContent=state.preview?'00:00.000 / '+fmt(state.end-state.start):fmt(state.start)+' / 01:32.000';
root.querySelectorAll('[data-type]').forEach(b=>{let on=b.dataset.type===state.type;b.setAttribute('aria-checked',String(on));b.querySelector('.check').hidden=!on;});
const picked=[...root.querySelectorAll('[data-track]:checked')];const mix=root.querySelector('[name="rb-trackmode"]:checked').value==='mix';q('rb-mode-field').hidden=picked.length<2;q('rb-save').disabled=audio&&picked.length===0;
q('rb-export-help').textContent=picked.length===0?(audio?'Choose at least one audio track.':'Export a silent video with no audio.'):picked.length===1?'Only the selected track will be included.':mix?'Selected tracks are normalized and mixed together. Overlapping audio may be counted twice.':audio?'Each track becomes a named MP3 in one output folder.':'Both tracks stay selectable in one video file.';
const [lo,hi]=bounds();q('rb-ruler').replaceChildren();for(let i=0;i<7;i++){let sp=document.createElement('span');sp.textContent=fmt(lo+(hi-lo)*i/6).slice(0,5);q('rb-ruler').append(sp);}
const left=(state.start-lo)/(hi-lo)*100,right=(state.end-lo)/(hi-lo)*100;const a=Math.max(0,Math.min(100,left)),b=Math.max(0,Math.min(100,right));q('rb-selection').style.left=a+'%';q('rb-selection').style.width=(b-a)+'%';q('rb-start-handle').hidden=left<0||left>100;q('rb-end-handle').hidden=right<0||right>100;q('rb-start-handle').style.left=a+'%';q('rb-end-handle').style.left=b+'%';
root.querySelectorAll('.wave-lane').forEach((lane,j)=>{lane.replaceChildren();for(let i=0;i<130;i++){let bar=document.createElement('b');const t=lo+(hi-lo)*i/130;const envelope=j===0?.22+.64*Math.abs(Math.sin(t*.83)*Math.cos(t*1.93)):.05+.65*Math.pow(Math.max(0,Math.sin(t*1.4)),3);bar.style.height=Math.max(2,envelope*design.laneHeight*(.35+.65*Math.abs(Math.sin(t*42.17+j*3))))+'px';lane.append(bar);}});
}
function setRange(which,value){if(!Number.isFinite(value))return;if(which==='start')state.start=Math.max(0,Math.min(state.end-.001,value));else state.end=Math.min(92,Math.max(state.start+.001,value));state.preview=false;render();}
function closeModal(){q('rb-modal-wrap').hidden=true;lastFocus?.focus();}
q('rb-nav-toggle').onclick=()=>{state.sidebarExpanded=!state.sidebarExpanded;render();remember();};
root.querySelectorAll('[data-nav]').forEach(button=>button.onclick=()=>{q('rb-status').hidden=false;q('rb-status').textContent='Mockup: opens '+button.dataset.nav+'.';if(globalThis.matchMedia?.('(max-width:680px)').matches){state.sidebarExpanded=false;render();remember();q('rb-nav-toggle').focus();}});
q('rb-export-arrow').onclick=()=>{const menu=q('rb-export-menu');menu.hidden=!menu.hidden;q('rb-export-arrow').setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)menu.querySelector('[aria-checked="true"]').focus();};
root.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;closeMenu();render();remember();q('rb-export-open').focus();});
q('rb-export-open').onclick=()=>{closeMenu();lastFocus=q('rb-export-open');render();q('rb-modal-wrap').hidden=false;q('rb-modal-close').focus();};
q('rb-modal-close').onclick=closeModal;q('rb-modal-cancel').onclick=closeModal;
q('rb-modal-wrap').onclick=e=>{if(e.target===q('rb-modal-wrap'))closeModal();};
root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!q('rb-modal-wrap').hidden)closeModal();else{closeMenu();q('rb-export-arrow').focus();}}if(!q('rb-modal-wrap').hidden&&e.key==='Tab'){const focusable=[...q('rb-modal-wrap').querySelectorAll('button:not(:disabled),input,select')].filter(el=>!el.closest('[hidden]'));let first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if(!q('rb-export-menu').hidden&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();let items=[...q('rb-export-menu').querySelectorAll('button')],idx=items.indexOf(document.activeElement);items[(idx+(e.key==='ArrowDown'?1:items.length-1))%items.length].focus();}});
document.addEventListener('click',e=>{if(!e.target.closest('#rb-clip-mock .split'))closeMenu();});
root.querySelectorAll('[data-track],[name="rb-trackmode"]').forEach(el=>el.onchange=()=>{render();remember();});
root.querySelectorAll('[data-nudge]').forEach(el=>el.onclick=()=>{let [k,n]=el.dataset.nudge.split(':');setRange(k,state[k]+Number(n)/1000);remember();});
for(const which of ['start','end']){q('rb-'+which).onchange=e=>{let match=e.target.value.match(/^(\d+):(\d{2}):(\d{2})\.(\d{3})$/);if(match&&Number(match[2])<60&&Number(match[3])<60){setRange(which,Number(match[1])*3600+Number(match[2])*60+Number(match[3])+Number(match[4])/1000);remember();}else render();};const handle=q('rb-'+which+'-handle');handle.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setRange(which,state[which]+(e.key==='ArrowLeft'?-.001:.001));remember();}};handle.onpointerdown=e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);};handle.onpointermove=e=>{if(!handle.hasPointerCapture(e.pointerId))return;let r=q('rb-wave').getBoundingClientRect(),[lo,hi]=bounds();setRange(which,Math.round((lo+(e.clientX-r.left)/r.width*(hi-lo))*1000)/1000);};handle.onpointerup=e=>{if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);remember();};}
q('rb-zoom-in').onclick=()=>{state.zoom=Math.min(16,state.zoom*2);render();remember();};q('rb-zoom-out').onclick=()=>{state.zoom=Math.max(1,state.zoom/2);render();remember();};q('rb-pan-left').onclick=()=>{state.center=Math.max(0,state.center-7.5/state.zoom);render();remember();};q('rb-pan-right').onclick=()=>{state.center=Math.min(92,state.center+7.5/state.zoom);render();remember();};
q('rb-preview').onclick=()=>{state.preview=!state.preview;render();};
q('rb-play').onclick=()=>{state.playing=!state.playing;q('rb-play').innerHTML='<i data-lucide="'+(state.playing?'pause':'play')+'" aria-hidden="true"></i>';q('rb-play').setAttribute('aria-label',state.playing?'Pause preview':'Play preview');globalThis.lucide?.createIcons();};q('rb-mute').onclick=()=>{state.muted=!state.muted;q('rb-mute').innerHTML='<i data-lucide="'+(state.muted?'volume-x':'volume-2')+'" aria-hidden="true"></i>';q('rb-mute').setAttribute('aria-label',state.muted?'Unmute preview':'Mute preview');globalThis.lucide?.createIcons();};
q('rb-save').onclick=()=>{closeModal();q('rb-status').hidden=false;q('rb-status').textContent=state.type==='audio'?'Mockup: opens the audio save location chooser.':'Mockup: opens the video save location chooser.';remember();};q('rb-back').onclick=()=>{q('rb-status').hidden=false;q('rb-status').textContent='Mockup: returns to the Library with the original item selected.';};
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(design,'playerHeight',{label:'Player height',min:360,max:560,step:10,unit:'px'});tweak.addSlider(design,'laneHeight',{label:'Waveform lane height',min:20,max:40,step:2,unit:'px'});}
})();
</script>
