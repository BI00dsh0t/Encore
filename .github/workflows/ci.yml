name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}

      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/fetch-ffmpeg.ps1') }}

      # A cached copy is still checked file by file against the hashes pinned in the script.
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - name: Build
        run: dotnet build Encore.slnx -c Release

      # Every project's default suite. A test that needs hardware the runner lacks skips itself.
      - name: Test
        shell: pwsh
        run: ./tools/test.ps1 -ResultsDirectory TestResults

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # NativeAOT turns trim and AOT warnings into errors only at publish time.
      - name: Publish the engine
        shell: pwsh
        run: ./tools/publish-engine.ps1
