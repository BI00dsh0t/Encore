name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and publish
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "'${{ github.ref_name }}' is not vX.Y.Z or vX.Y.Z-suffix." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build Encore.slnx -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        shell: pwsh
        run: |
          foreach ($project in 'Contracts', 'Core', 'Media') {
            dotnet test --project "tests/Encore.$project.Tests" -c Release --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish
        shell: pwsh
        run: ./tools/publish.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload the unsigned app
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unsigned
          path: publish/Encore
          if-no-files-found: error

  # Runs once SignPath Foundation has approved the project and the repository variables exist.
  # The release environment needs the maintainer's approval, so nothing is signed unseen.
  sign:
    name: Sign
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-2025
    environment: release
    timeout-minutes: 30
    steps:
      - name: Sign through SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload the signed app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-signed
          path: signed
          if-no-files-found: error

  pack:
    name: Pack and draft the release
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      SIGNED: ${{ needs.sign.result == 'success' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Download the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'app-signed' || 'app-unsigned' }}
          path: publish/Encore

      # vpk writes the installer, the portable zip, the full package and the update feed.
      - name: Pack the installer and the portable zip
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.161
          $channel = if ($env:PRERELEASE -eq 'true') { 'beta' } else { 'win' }
          vpk pack --packId EncoreApp --packVersion $env:VERSION --packDir publish/Encore `
            --mainExe Encore.App.exe --packTitle Encore --packAuthors BI00dsh0t `
            --channel $channel --outputDir releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write the software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: publish/Encore
          format: cyclonedx-json
          output-file: releases/Encore-${{ env.VERSION }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write the checksums
        shell: pwsh
        run: |
          Get-ChildItem releases -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content releases/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: releases/*

      - name: Write the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      - name: Add the FFmpeg source and signing lines
        shell: pwsh
        run: |
          $script = Get-Content tools/fetch-ffmpeg.ps1 -Raw
          $release = [regex]::Match($script, "\`$Release = '([^']+)'").Groups[1].Value
          $asset = [regex]::Match($script, "\`$Asset = '([^']+)'").Groups[1].Value
          $signing = if ($env:SIGNED -eq 'true') {
            'The binaries are signed. Free code signing provided by SignPath.io, certificate by SignPath Foundation.'
          } else {
            'This release is not code signed yet, so Windows SmartScreen may warn before it runs.'
          }
          @"

          ---

          $signing

          Encore ships FFmpeg, built with GPL components: [$asset](https://github.com/BtbN/FFmpeg-Builds/releases/tag/$release).
          Its source is [FFmpeg](https://github.com/FFmpeg/FFmpeg) at the commit in that build's name, with the build scripts in
          [BtbN/FFmpeg-Builds](https://github.com/BtbN/FFmpeg-Builds). See THIRD-PARTY-NOTICES.txt for every component's license.

          Verify a download with ``gh attestation verify <file> --repo ${{ github.repository }}`` or against SHA256SUMS.txt.
          "@ | Add-Content release-notes.md -Encoding utf8NoBOM

      # A draft: the maintainer smoke tests it, then publishes it, and only then do installed copies see it.
      - name: Upload the draft release
        shell: pwsh
        run: |
          $pre = if ($env:PRERELEASE -eq 'true') { @('--pre') } else { @() }
          vpk upload github --outputDir releases --repoUrl "https://github.com/${{ github.repository }}" `
            --token $env:GH_TOKEN --tag "v$env:VERSION" --releaseName "Encore $env:VERSION" @pre
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extras = Get-ChildItem releases -File | Where-Object { $_.Name -like '*sbom*' -or $_.Name -eq 'SHA256SUMS.txt' }
          gh release upload "v$env:VERSION" $extras.FullName --clobber
          gh release edit "v$env:VERSION" --notes-file release-notes.md
